const el=id=>document.getElementById(id), goal=el('goal'), slider=el('step');
const all=[...d.history,...d.poses,...Object.values(d.goals)], xx=all.map(p=>p[0]),zz=all.map(p=>p[2]);
const x=(Math.min(...xx)+Math.max(...xx))/2,z=(Math.min(...zz)+Math.max(...zz))/2;
const scale=360/Math.max(Math.max(...xx)-Math.min(...xx),Math.max(...zz)-Math.min(...zz),.01);
const point=p=>[200+(p[0]-x)*scale,200+(p[2]-z)*scale], line=ps=>ps.map(p=>point(p).join(',')).join(' ');
let timer;
function stop(){clearInterval(timer);timer=null;el('play').textContent='Play'}
function draw(){const r=d.results[goal.selectedIndex],i=+slider.value,s=r.trace[i],p=point(d.poses[s.state]),g=point(d.goals[r.goal]);
el('camera').src='data:image/jpeg;base64,'+d.frames[s.state];slider.max=r.trace.length-1;
el('map').innerHTML='<polyline fill="none" stroke="#ac702e" stroke-width="3" points="'+line(d.history)+'"/>'+
'<polyline fill="none" stroke="#166e9f" stroke-width="5" points="'+line(r.trace.slice(0,i+1).map(q=>d.poses[q.state]))+'"/>'+
'<rect x="-5" y="-5" width="10" height="10" transform="translate('+g.join(' ')+') rotate(45)"/>'+
'<circle r="5" fill="#166e9f" stroke="white" cx="'+p[0]+'" cy="'+p[1]+'"/>';
el('status').textContent='Step '+(i+1)+' / '+r.trace.length+' · '+s.action+(i===r.trace.length-1?' · '+r.outcome:'');}
d.results.forEach(r=>goal.add(new Option(r.goal,r.goal)));goal.onchange=()=>{stop();slider.value=0;draw()};slider.oninput=()=>{stop();draw()};
el('play').onclick=()=>{if(timer){stop();return}if(+slider.value===+slider.max)slider.value=0;draw();el('play').textContent='Pause';
timer=setInterval(()=>{if(+slider.value>=+slider.max){stop();return}slider.value=+slider.value+1;draw()},360)};draw();</script></html>
